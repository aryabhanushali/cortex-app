      <script>
        // before loading from last page
      (function preselectButtons() {
        const urlParams = new URLSearchParams(window.location.search);
        const selectedTraining = urlParams.get("training") || "Murty185";
        const selectedDataset = urlParams.get("dataset") || localStorage.getItem("selectedDataset") || "NSD";
        const selectedROI = urlParams.get("roi") || localStorage.getItem("selectedROI") || "Overall";
       
          document.addEventListener("DOMContentLoaded", () => {
            const trainBtn = document.getElementById(`btn-training-${selectedTraining}`);
            const datasetBtn = document.getElementById(`btn-${selectedDataset}`);
            const roiBtn = document.getElementById(`btn-${selectedROI}`);
            if (trainBtn) trainBtn.classList.add("selected-button");
            if (datasetBtn) datasetBtn.classList.add("selected-button");
            if (roiBtn) roiBtn.classList.add("selected-button");
            updateTraining(selectedTraining);
          });
        })();

        

        const width = 750, height = 600;
        const margin = { top: 50, right: 30, bottom: 50, left: 180 };

        let selectedDataset;
        let selectedROI;
        let selectedTraining;


        window.addEventListener("load", function() {
            const urlParams = new URLSearchParams(window.location.search);
            selectedTraining = localStorage.getItem("selectedTraining") || urlParams.get("training") || "Murty185";
            selectedDataset = localStorage.getItem("selectedDataset") || urlParams.get("dataset") || "NSD";
            selectedROI = localStorage.getItem("selectedROI") || urlParams.get("roi") || "Overall";
            // updateTraining(selectedTraining);

          loadData((data) => {  
                // drawChart("#overall", overallData, 'Cross-Regions Performances on Dataset: ' + selectedDataset);
                window.allTrainingData = data;
                const trainingData = data[selectedTraining];
                console.log("✅ Data Loaded inside onload:", trainingData.overallData, trainingData.ppaData, trainingData.ffaData, trainingData.ebaData);
                
                if (!trainingData.overallData || trainingData.overallData.length === 0) {
                    console.error("❌ overallData is empty!");
                    return;
                }

                window.overallData = trainingData.overallData;
                window.ppaData = trainingData.ppaData;
                window.ffaData = trainingData.ffaData;
                window.ebaData = trainingData.ebaData;

                
                d3.select(`#btn-${selectedDataset}`).classed("selected-button", true);
                d3.select(`#btn-training-${selectedTraining}`).classed("selected-button", true);
                d3.select(`#btn-${selectedROI}`).classed("selected-button", true);

                updateChart();
                updateDataset(selectedDataset);
                updateTraining(selectedTraining);

            });
      });

        function updateDataset(dataset, isUserClick = false) {
          
            console.log(dataset);
            console.log(selectedDataset);
            console.log(isUserClick);
            console.log(isUserClick && selectedDataset === dataset);
            if (isUserClick && selectedDataset === dataset) {
              window.location.href = `overall-performance-accross-all-regions.html?training=${selectedTraining}&dataset=${selectedDataset}&roi="`;
              return;
          }
        
            selectedDataset = dataset;
          
            d3.selectAll(".button-container button").classed("selected-button", false);
            d3.select(`#btn-${dataset}`).classed("selected-button", true);
            d3.select(`#btn-training-${selectedTraining}`).classed("selected-button", true);
            d3.select(`#btn-${selectedROI}`).classed("selected-button", true);
            

            updateChart();
        }
        function updateTraining(training) {
            selectedTraining = training;
            const evalNSD = document.getElementById("btn-NSD");
            const evalMurty = document.getElementById("btn-Murty185");
            d3.selectAll("button").classed("selected-button", false);
            d3.select(`#btn-training-${training}`).classed("selected-button", true);
            d3.select(`#btn-${selectedDataset}`).classed("selected-button", true);
            d3.select(`#btn-${selectedROI}`).classed("selected-button", true);

            
            if (training === "Murty185") {
                evalMurty.style.display = "none"; 
                evalNSD.style.display = "inline-block"; 
            } else if (training === "NSD") {
                evalNSD.style.display = "none"; 
                evalMurty.style.display = "inline-block"; 
            }

            const trainingData = window.allTrainingData[selectedTraining];
            window.overallData = trainingData.overallData;
            updateChart();
        }

        function updateChart() {
            d3.select("#overall").select("svg").remove();  

            let filteredData = window.overallData.filter(d => d.dataset === selectedDataset);

            if (!filteredData.length) {
                console.log(`❌ No data available for ${selectedDataset}`);
                return;
            }

            console.log(`✅ Drawing chart for ${selectedDataset}`);
            drawChart("#overall", filteredData, `Cross-Regions Performances on ${selectedDataset}`);
        }

        function updateROI(roi){
            selectedROI = roi;
            window.location.href = `roi-performance-page.html?training=${selectedTraining}&dataset=${selectedDataset}&roi=${selectedROI}`;


        }

       
    </script>
