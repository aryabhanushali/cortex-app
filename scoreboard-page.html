      <script>

        let width = window.innerWidth * 0.9;  
        let height = window.innerHeight * 0.8; 
        const margin = { top: 30 , right: 150, bottom: 50, left: 300 };

       
        
        

        window.addEventListener("load", function() {
          console.log("✅ window.onload triggered!");

          function resizeChart() {
                width = window.innerWidth * 0.9;
                height = window.innerHeight * 0.8;
                
                d3.select("#overall").select("svg").remove();  
                drawChartOverall("#overall", window.overallData, "Cross-Regions"); 
                
            }

          window.addEventListener("resize", resizeChart);
          document.getElementById("loading-overlay").style.display = "flex";
          loadData((overallData, ppaData, ffaData, ebaData) => { 
              console.log("✅ Data Loaded inside onload:", overallData, ppaData, ffaData, ebaData);
              
              if (!overallData || overallData.length === 0) {
                  console.error("❌ overallData is empty!");
                  return;
              }

              window.overallData = overallData;
              window.ppaData = ppaData;
              window.ffaData = ffaData;
              window.ebaData = ebaData;

              drawChartOverall("#overall", overallData, "Cross-Regions");
              d3.select(`button[onclick="updateChart('overall')"]`).classed("selected-button", true);
              document.getElementById("loading-overlay").style.display = "none";
              
          });
          
      });

        let selectedRegion = "overall"; 
        function updateChart(region) {

            selectedRegion = region;
            d3.select("#overall").select("svg").remove();  
            d3.selectAll("button").classed("selected-button", false);
            d3.select(`button[onclick="updateChart('${region}')"]`).classed("selected-button", true);


            if (region === 'overall') {
                drawChartOverall("#overall", overallData, "Cross-Regions");
            } else if (region === 'PPA') {
                drawChartOverall("#overall", ppaData, "PPA");
            } else if (region === 'FFA') {
                drawChartOverall("#overall", ffaData, "FFA");
            } else if (region === 'EBA') {
                drawChartOverall("#overall", ebaData, "EBA");
            }
        }
    </script>
