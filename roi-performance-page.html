      <script>

        const width = 750, height = 575;
        const margin = { top: 50, right: 0, bottom: 50, left: 180 };

        let selectedDataset = "NSD";
        let selectedROI = "PPA";
        let selectedTraining = "Murty185"

        window.addEventListener("load", function() {
          const urlParams = new URLSearchParams(window.location.search);

          selectedDataset = urlParams.get("dataset") || "NSD"; 
          selectedROI = urlParams.get("roi") || "PPA"; 
          selectedDataset = urlParams.get("training") || "Murty185";

          
          loadData((overallData, ppaData, ffaData, ebaData) => { 
              console.log("✅ Data Loaded inside onload:", overallData, ppaData, ffaData, ebaData);
              

              window.overallData = overallData;
              window.ppaData = ppaData;
              window.ffaData = ffaData;
              window.ebaData = ebaData;

              d3.selectAll(".button-container button").classed("selected-button", false);
              d3.select(`#btn-${selectedDataset}`).classed("selected-button", true);
              d3.select(`#btn-${selectedROI}`).classed("selected-button", true);
              updateChart();
              updateHeatmaps();  
          });
      });

      function updateDataset(dataset) {
        selectedDataset = dataset;
       

        d3.selectAll(".button-container button").classed("selected-button", false);
        d3.select(`#btn-${dataset}`).classed("selected-button", true);
        d3.select(`#btn-${selectedROI}`).classed("selected-button", true);

       


        updateChart();
      
      }

      function updateROI(roi) {
        selectedROI = roi;

        d3.selectAll(".button-container button").classed("selected-button", false);
        d3.select(`#btn-${selectedDataset}`).classed("selected-button", true);
        d3.select(`#btn-${roi}`).classed("selected-button", true);

        
        updateChart();
       
      }

      function updateChart() {
        d3.select("#roi").select("svg").remove();

        let data;
        if (selectedROI === "PPA") data = window.ppaData;
        else if (selectedROI === "FFA") data = window.ffaData;
        else if (selectedROI === "EBA") data = window.ebaData;

        let filteredData = data.filter(d => d.dataset === selectedDataset);

        drawChart("#roi", filteredData, `${selectedROI} Performance on ${selectedDataset}`);
        updateHeatmaps();
      }

      function goToCrossRegion() {
            window.location.href = `cross-region-performance-page.html?dataset=${selectedDataset}`;
        }



    let selectedSubject = "S1";

    function updateSubject(subject) {
        selectedSubject = subject;
        document.getElementById("selected-subject").innerText = subject;
        updateHeatmaps();  // 更新热力图
    }
    function updateHeatmaps() {
        const heatmapContainer = document.getElementById("model-heatmaps");
        heatmapContainer.innerHTML = "";  // 清空旧的 heatmap

        let data;
        if (selectedROI === "PPA") data = window.ppaData;
        else if (selectedROI === "FFA") data = window.ffaData;
        else if (selectedROI === "EBA") data = window.ebaData;

        let filteredModels = data.filter(d => d.dataset === selectedDataset);
        
        filteredModels.forEach((d, index) => {
            let heatmapDiv = document.createElement("div");
            heatmapDiv.className = "heatmap";
            heatmapDiv.id = `heatmap-${index + 1}`;

            let title = document.createElement("p");
            title.innerText = d.model; // Model 名字作为标题

            let wrapper = document.createElement("div");
            wrapper.appendChild(title);
            wrapper.appendChild(heatmapDiv);

            heatmapContainer.appendChild(wrapper);
        });
    }



    </script>
